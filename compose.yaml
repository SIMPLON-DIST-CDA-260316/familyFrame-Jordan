services:
  database:
    image: mongo:8.0.38
    command: ["--replSet", "rs0"]
    volumes:
      - mongo-data:/data/db
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status() } catch { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'database:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)",
        ]
      interval: 5s
      start_period: 20s
      start_interval: 1s

  # Service ponctuel : pousse le schéma Prisma (index) dans MongoDB puis s'arrête (sans effet si la base est déjà à jour)
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      # Seule étape qui contient le CLI Prisma (absent de l'image de prod de l'API)
      target: base
    command: ["pnpm", "db:push"]
    environment:
      DATABASE_URL: mongodb://database:27017/familyframe?replicaSet=rs0
    networks:
      - backend
    depends_on:
      database:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DATABASE_URL: mongodb://database:27017/familyframe?replicaSet=rs0
      # HOST_IP (fichier .env à la racine) : adresse du PC sur le Wi-Fi, pour ouvrir l'app depuis un smartphone
      CORS_ORIGIN: http://${HOST_IP:-localhost}:5173
    ports:
      - "3000:3000"
    networks:
      - backend
    # migrate attend déjà que database soit healthy
    depends_on:
      migrate:
        condition: service_completed_successfully

  front:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Adresse utilisée par le navigateur (pas par Docker), inscrite dans le JS au build : changer HOST_IP demande un rebuild
        VITE_API_URL: http://${HOST_IP:-localhost}:3000
    ports:
      - "5173:8080"

volumes:
  mongo-data:

networks:
  backend:
